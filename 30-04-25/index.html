<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="style.css" />
    <title>CAIXA</title>
</head>
<body>
    <div class="img caixa">
        <img src="/img/Captura_de_tela_2025-05-01_154301.png" alt="Imagem do Caixa" />
    </div>
    <div class="container">
        <div class="formulario">
            <h1>CAIXA <i class='bx bx-money-withdraw'></i></h1>
            <form action="script.php" method="post">
                <label for="nomeCliente">Nome Completo
                    <input type="text" name="nomeCliente" id="nomeCliente" required />
                </label>
                <br />

                <label for="produto1">1° Produto
                    <input type="text" name="produto1" id="produto1" required />
                </label>
                <br />

                <label for="valor1">Valor do 1° Produto
                    <input type="number" step="0.01" name="valor1" id="valor1" required />
                </label>
                <br />

                <label for="produto2">2° Produto
                    <input type="text" name="produto2" id="produto2" required />
                </label>
                <br />

                <label for="valor2">Valor do 2° Produto
                    <input type="number" step="0.01" name="valor2" id="valor2" required />
                </label>
                <br />

                <label for="valorPago">Valor Pago
                    <input type="number" step="0.01" name="valorPago" id="valorPago" required />
                </label>
                <br />

                <button type="submit">Gerar Nota Fiscal</button>
            </form>
        </div>
    </div>
</body>
</html>
